<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" style="background:transparent;">
  <defs>
    <radialGradient id="markerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A86A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C9A86A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Stylised Sumatra island outline -->
  <path d="M 95 50
           Q 110 40, 130 50
           L 165 80
           Q 180 95, 195 115
           L 230 155
           Q 250 180, 265 215
           L 290 260
           Q 310 290, 335 320
           L 370 355
           Q 395 380, 420 395
           Q 410 380, 395 365
           L 370 340
           Q 340 305, 320 270
           L 295 230
           Q 275 195, 255 160
           L 225 125
           Q 205 100, 175 75
           Q 145 55, 120 50
           Z"
        fill="rgba(45,125,70,0.15)"
        stroke="rgba(201,168,106,0.45)"
        stroke-width="1.2"/>

  <!-- Grid lines / equator hint -->
  <line x1="0" y1="280" x2="600" y2="280"
        stroke="rgba(201,168,106,0.12)" stroke-width="0.5" stroke-dasharray="3,5"/>
  <line x1="0" y1="180" x2="600" y2="180"
        stroke="rgba(201,168,106,0.08)" stroke-width="0.5" stroke-dasharray="3,5"/>

  <!-- AGSC marker (Aceh, NW Sumatra) -->
  <circle cx="140" cy="75" r="28" fill="url(#markerGlow)"/>
  <circle cx="140" cy="75" r="6" fill="#C9A86A"/>
  <circle cx="140" cy="75" r="10" fill="none" stroke="#C9A86A" stroke-width="1.2" opacity="0.7"/>
  <line x1="140" y1="75" x2="195" y2="50" stroke="rgba(201,168,106,0.6)" stroke-width="0.8"/>
  <text x="200" y="42" font-family="Georgia, serif" font-size="14" font-weight="500" fill="#E3CFA0">AGSC — Aceh</text>
  <text x="200" y="58" font-family="'Courier New', monospace" font-size="10" fill="rgba(154,167,157,0.85)">Project One · Flagship</text>

  <!-- Jambi-1 marker (mid-Sumatra) -->
  <circle cx="270" cy="220" r="22" fill="url(#markerGlow)" opacity="0.7"/>
  <circle cx="270" cy="220" r="5" fill="#2D7D46"/>
  <circle cx="270" cy="220" r="9" fill="none" stroke="#2D7D46" stroke-width="1" opacity="0.7"/>
  <line x1="270" y1="220" x2="340" y2="245" stroke="rgba(45,125,70,0.5)" stroke-width="0.8"/>
  <text x="345" y="238" font-family="Georgia, serif" font-size="13" font-weight="500" fill="#E3CFA0">Project Two</text>
  <text x="345" y="252" font-family="'Courier New', monospace" font-size="10" fill="rgba(154,167,157,0.85)">Pipeline</text>

  <!-- Additional marker (dim, central Sumatra placeholder) -->
  <circle cx="335" cy="320" r="18" fill="url(#markerGlow)" opacity="0.4"/>
  <circle cx="335" cy="320" r="4" fill="rgba(154,167,157,0.7)"/>
  <line x1="335" y1="320" x2="400" y2="345" stroke="rgba(154,167,157,0.3)" stroke-width="0.8" stroke-dasharray="2,3"/>
  <text x="405" y="340" font-family="Georgia, serif" font-size="12" fill="rgba(154,167,157,0.7)">Additional</text>
  <text x="405" y="354" font-family="'Courier New', monospace" font-size="10" fill="rgba(154,167,157,0.5)">Structuring</text>

  <!-- Labels -->
  <text x="50" y="395" font-family="'Courier New', monospace" font-size="11" fill="rgba(154,167,157,0.7)" letter-spacing="2">SUMATRA · INDONESIA</text>
</svg>
